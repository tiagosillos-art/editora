<body>
<div id="hint">Bubble Fluid v1</div>
<canvas id="webgl"></canvas>
<aside id="panel">
<h1>Bubble Fluid v1</h1>

<label>Restituição <input id="restitution" max="0.8" min="0" step="0.01" type="range" value="0.28"/></label>
<label>Partículas <input id="particleScale" max="14" min="1" step="0.1" type="range" value="7"/></label>
</aside>
<button id="togglePanel">ocultar painel</button>
